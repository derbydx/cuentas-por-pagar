{% extends "base.html" %}

{% block titulo %}{{ 'Editar proveedor' if proveedor else 'Nuevo proveedor' }} | Cuentas por pagar{% endblock %}

{% block contenido %}
<section>
  <hgroup>
    <h1>{{ 'Editar proveedor' if proveedor else 'Nuevo proveedor' }}</h1>
    <p>Los campos teléfono, email y notas son opcionales.</p>
  </hgroup>

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" value="{{ proveedor['nombre'] if proveedor else '' }}" required autofocus>

    <div class="grid">
      <div>
        <label for="telefono">Teléfono</label>
        <input type="text" id="telefono" name="telefono" value="{{ proveedor['telefono'] if proveedor and proveedor['telefono'] else '' }}">
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ proveedor['email'] if proveedor and proveedor['email'] else '' }}">
      </div>
    </div>

    <label for="notas">Notas</label>
    <textarea id="notas" name="notas" rows="4">{{ proveedor['notas'] if proveedor and proveedor['notas'] else '' }}</textarea>

    <button type="submit">Guardar</button>
    <a href="{{ url_for('proveedores') }}" role="button" class="secondary">Cancelar</a>
  </form>
</section>
{% endblock %}
